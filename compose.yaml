# Только разработка HTTP localhost; защищённое развёртывание не заявляется.
services:
  db:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Сначала выполните scripts/init_dev_env.py}
      APP_DB_NAME: ${POSTGRES_DB:?Укажите POSTGRES_DB}
      APP_DB_USER: ${POSTGRES_USER:?Укажите POSTGRES_USER}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - database:/var/lib/postgresql/data
      - ./deploy/postgres/init-app.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  app:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Сначала выполните scripts/init_dev_env.py}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB:?Укажите POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Укажите POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_SETTINGS_MODULE: config.settings.development
      STATIC_ROOT: /app/staticfiles
      EVIDENCE_ROOT: /app/private-evidence
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python manage.py collectstatic --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile - --error-logfile - --worker-tmp-dir /tmp"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - static:/app/staticfiles
      - evidence:/app/private-evidence
    networks: [web, database]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  nginx:
    image: nginx:1.30.6-alpine
    entrypoint: ["nginx", "-g", "daemon off;"]
    user: "101:101"
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./deploy/nginx/development.conf:/etc/nginx/nginx.conf:ro
      - static:/srv/static:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [ingress, web]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  database:
  static:
  evidence:
networks:
  # Сеть со шлюзом нужна только Nginx для публикации localhost-порта.
  ingress:
    driver: bridge
  web:
    internal: true
  database:
    internal: true
